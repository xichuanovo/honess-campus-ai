<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘岗位 | 泓济环保校招</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .page-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; padding: 48px 24px; text-align: center; }
        .page-header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .page-header p { font-size: 15px; opacity: 0.9; }

        .filter-bar {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            margin-bottom: 24px; padding: 16px 20px; background: var(--white);
            border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .filter-bar select {
            padding: 10px 16px; border: 2px solid var(--border); border-radius: 8px;
            font-size: 14px; font-family: inherit; background: var(--white); cursor: pointer;
        }
        .filter-bar select:focus { outline: none; border-color: var(--primary); }
        .filter-bar .filter-label { font-size: 14px; font-weight: 600; color: var(--text-light); }

        .job-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .job-card {
            background: var(--white); border-radius: var(--radius); padding: 24px;
            box-shadow: var(--shadow); transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid var(--primary); cursor: pointer;
        }
        .job-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .job-card .job-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .job-card .job-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .job-card .job-desc { font-size: 14px; color: var(--text-light); line-height: 1.7; margin-bottom: 16px; }
        .job-card .job-footer { display: flex; justify-content: space-between; align-items: center; }
        .job-card .job-salary { font-size: 16px; font-weight: 700; color: var(--primary); }
        .job-card .job-apply { font-size: 14px; font-weight: 600; color: var(--primary); }

        .job-detail-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .job-detail-overlay.show { display: flex; }
        .job-detail-modal {
            background: var(--white); border-radius: var(--radius); max-width: 640px; width: 100%;
            max-height: 85vh; overflow-y: auto; padding: 36px;
        }
        .job-detail-modal h2 { font-size: 24px; margin-bottom: 12px; }
        .job-detail-modal .modal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .job-detail-modal .modal-section { margin-bottom: 20px; }
        .job-detail-modal .modal-section h4 { font-size: 15px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; }
        .job-detail-modal .modal-section p, .job-detail-modal .modal-section div { font-size: 14px; color: var(--text-light); line-height: 1.8; white-space: pre-line; }
        .job-detail-modal .modal-close {
            position: absolute; top: 16px; right: 20px; font-size: 24px; cursor: pointer;
            color: var(--text-light); background: none; border: none;
        }
        .job-detail-modal .modal-actions { display: flex; gap: 12px; margin-top: 24px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state .emoji { font-size: 64px; margin-bottom: 16px; }

        @media (max-width: 768px) {
            .job-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="index.html">
                <img class="brand-logo" src="images/honess-logo.png" alt="HONESS 泓济环保">
                <div class="brand-name">校园招聘<small>HONESS Campus Recruitment</small></div>
            </a>
            <button class="navbar-toggle" aria-label="菜单" onclick="this.classList.toggle('active');document.getElementById('mainNav').classList.toggle('open')">
                <span></span><span></span><span></span>
            </button>
            <div class="navbar-links" id="mainNav">
                <a href="index.html">首页</a>
                <a href="jobs.html" class="active">招聘岗位</a>
                <a href="apply.html">投递简历</a>
                <a href="mbti.html">性格测试</a>
                <a href="schedule.html">AI初试</a>
                <a href="admin.html" class="admin-btn">HR管理</a>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <h1>招聘岗位</h1>
        <p>总有一个岗位，让你的才华有处安放</p>
    </div>

    <div class="container">
        <div class="filter-bar">
            <span class="filter-label">方向：</span>
            <select id="filterCategory" onchange="loadJobs()">
                <option value="">全部方向</option>
                <option value="tech">技术研发类</option>
                <option value="project">项目工程类</option>
                <option value="business">商务市场类</option>
                <option value="operations">运营服务类</option>
                <option value="support">职能支持类</option>
            </select>
            <span class="filter-label">学历：</span>
            <select id="filterEducation" onchange="loadJobs()">
                <option value="">全部学历</option>
                <option value="bachelor">本科及以上</option>
                <option value="master">硕士及以上</option>
                <option value="phd">博士及以上</option>
                <option value="postdoc">博士后</option>
            </select>
        </div>
        <div class="job-list" id="jobList"></div>
    </div>

    <!-- Job Detail Modal -->
    <div class="job-detail-overlay" id="jobDetailOverlay" onclick="if(event.target===this)closeDetail()">
        <div class="job-detail-modal" style="position:relative">
            <button class="modal-close" onclick="closeDetail()">&times;</button>
            <div id="jobDetailContent"></div>
        </div>
    </div>

    <script>
        const eduLabels = { bachelor: '本科', master: '硕士', phd: '博士', postdoc: '博士后' };
        const catLabels = { tech: '技术研发', project: '项目工程', business: '商务市场', operations: '运营服务', support: '职能支持' };

        const urlParams = new URLSearchParams(location.search);
        if (urlParams.get('category')) {
            document.getElementById('filterCategory').value = urlParams.get('category');
        }

        function loadJobs() {
            const cat = document.getElementById('filterCategory').value;
            const edu = document.getElementById('filterEducation').value;
            let url = '/api/jobs';
            const params = [];
            if (cat) params.push('category=' + cat);
            if (params.length) url += '?' + params.join('&');

            fetch(url).then(r => r.json()).then(jobs => {
                let filtered = jobs;
                if (edu) {
                    const eduOrder = { bachelor: 1, master: 2, phd: 3, postdoc: 4 };
                    filtered = jobs.filter(j => (eduOrder[j.education_min] || 0) <= (eduOrder[edu] || 0));
                }
                renderJobs(filtered);
            });
        }

        function renderJobs(jobs) {
            const list = document.getElementById('jobList');
            if (jobs.length === 0) {
                list.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="emoji">📭</div><p>暂无符合条件的岗位</p></div>';
                return;
            }
            list.innerHTML = jobs.map(j => `
                <div class="job-card fade-in" onclick="showDetail(${j.id})">
                    <div class="job-title">${j.title}</div>
                    <div class="job-meta">
                        <span class="badge badge-green">${catLabels[j.category] || j.category}</span>
                        <span class="badge badge-blue">${eduLabels[j.education_min] || '不限'}及以上</span>
                        ${j.location ? `<span class="badge badge-gray">📍 ${j.location}</span>` : ''}
                        ${j.headcount > 1 ? `<span class="badge badge-orange">${j.headcount}人</span>` : ''}
                    </div>
                    <div class="job-desc">${(j.description || '').substring(0, 100)}...</div>
                    <div class="job-footer">
                        <span class="job-salary">${j.salary_range || '面议'}</span>
                        <span class="job-apply">查看详情 →</span>
                    </div>
                </div>
            `).join('');
        }

        function showDetail(id) {
            fetch('/api/jobs/' + id).then(r => r.json()).then(job => {
                document.getElementById('jobDetailContent').innerHTML = `
                    <h2>${job.title}</h2>
                    <div class="modal-meta">
                        <span class="badge badge-green">${catLabels[job.category] || job.category}</span>
                        <span class="badge badge-blue">${eduLabels[job.education_min] || '不限'}及以上</span>
                        ${job.location ? `<span class="badge badge-gray">📍 ${job.location}</span>` : ''}
                        <span class="badge badge-orange">招${job.headcount}人</span>
                        <span class="badge badge-purple">💰 ${job.salary_range || '面议'}</span>
                    </div>
                    ${job.description ? `<div class="modal-section"><h4>📋 岗位描述</h4><div>${job.description}</div></div>` : ''}
                    ${job.responsibilities ? `<div class="modal-section"><h4>📝 岗位职责</h4><div>${job.responsibilities}</div></div>` : ''}
                    ${job.requirements ? `<div class="modal-section"><h4>✅ 任职要求</h4><div>${job.requirements}</div></div>` : ''}
                    <div class="modal-actions">
                        <a href="apply.html?job_id=${job.id}" class="btn btn-primary">立即投递 →</a>
                        <button class="btn btn-outline" onclick="closeDetail()">关闭</button>
                    </div>
                `;
                document.getElementById('jobDetailOverlay').classList.add('show');
            });
        }

        function closeDetail() {
            document.getElementById('jobDetailOverlay').classList.remove('show');
        }

        loadJobs();
    </script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-api.js"></script>
    <script src="js/api-fallback.js"></script>
</body>
</html>
